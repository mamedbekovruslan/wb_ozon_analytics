<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Страница не найдена</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.ds{font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:20px;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;--r-xs:4px;--r-sm:6px;--r-md:8px;--r-lg:12px;--r-xl:16px;--r-full:999px;--dur:120ms;--ease:cubic-bezier(.2,0,0,1);--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ds[data-theme=light]{color-scheme:light;--bg:#F6F7F9;--surface:#FFFFFF;--surface-2:#F1F3F6;--surface-3:#E7EAEF;--border:#E3E6EB;--border-strong:#CBD1D9;--text:#12151A;--text-2:#4A5260;--text-3:#646E7E;--text-on-accent:#FFFFFF;--accent:#3553D1;--accent-hover:#2C47BC;--accent-press:#253DA3;--accent-soft:#EDF1FF;--focus:#3553D1;--success:#1B7A4A;--success-soft:#E6F4EC;--warning:#985600;--warning-soft:#FFF2DC;--danger:#C02A2A;--danger-soft:#FDECEC;--neutral:#4A5260;--neutral-soft:#EEF0F3;--wb:#0E8A7A;--wb-soft:#E2F4F1;--wb-text:#0A6B5F;--ozon:#E07A12;--ozon-soft:#FFF0E0;--ozon-text:#9A4C00;--prev:#8A93A2;--grid:#EDEFF2;--axis:#646E7E;--skeleton:#ECEEF2;--overlay:rgba(18,21,26,.40);--shadow-sm:0 1px 2px rgba(16,24,40,.05);--shadow-md:0 4px 12px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.04);--shadow-lg:0 16px 40px rgba(16,24,40,.16),0 2px 6px rgba(16,24,40,.06)}
.ds[data-theme=dark]{color-scheme:dark;--bg:#0D0F13;--surface:#15181E;--surface-2:#1C2027;--surface-3:#252A33;--border:#252A33;--border-strong:#363D49;--text:#E8EBF0;--text-2:#A9B1BE;--text-3:#8792A2;--text-on-accent:#0D0F13;--accent:#8098FF;--accent-hover:#97ABFF;--accent-press:#6D86F2;--accent-soft:#1D2442;--focus:#97ABFF;--success:#4CC38A;--success-soft:#11261B;--warning:#F0B04A;--warning-soft:#2B2112;--danger:#FF7A7A;--danger-soft:#301617;--neutral:#A9B1BE;--neutral-soft:#22262E;--wb:#2EC4AE;--wb-soft:#0F2B27;--wb-text:#5ED6C3;--ozon:#FFA552;--ozon-soft:#33230F;--ozon-text:#FFB774;--prev:#6B7484;--grid:#1F232A;--axis:#8792A2;--skeleton:#21252D;--overlay:rgba(0,0,0,.60);--shadow-sm:0 0 0 1px rgba(255,255,255,.02);--shadow-md:0 6px 16px rgba(0,0,0,.40);--shadow-lg:0 20px 48px rgba(0,0,0,.60),0 0 0 1px #2A2F38}
.num{font-variant-numeric:tabular-nums}
.ds button{font:inherit;cursor:pointer}
.ds :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.btn{transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease)}
.btn-p:hover{background:var(--accent-hover)!important}.btn-p:active{background:var(--accent-press)!important}
.btn-s:hover{background:var(--surface-2)!important;border-color:var(--border-strong)!important}.btn-s:active{background:var(--surface-3)!important}
.card-link{transition:border-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.card-link:hover{border-color:var(--border-strong)!important;box-shadow:var(--shadow-md)!important}
.card-link:hover .arrow{color:var(--accent)!important}
.lnk{color:var(--accent);text-decoration:none}.lnk:hover{text-decoration:underline;text-underline-offset:3px}
</style>
</helmet>
<div class="ds" data-theme="{{theme}}" style="position: relative; width: 100%; min-height: {{minH}}px; display: flex; flex-direction: column; background: var(--bg)">
<dc-import name="Chrome" theme="{{theme}}" layout="{{layout}}" active="notfound" filters="false" hint-size="100%,56px"></dc-import>

<main style="flex: 1; width: 100%; box-sizing: border-box; padding: {{L.pad}}; display: flex; align-items: {{L.align}}; justify-content: center">
<div style="width: 100%; max-width: 720px; display: flex; flex-direction: column; align-items: {{L.items}}; text-align: {{L.text}}; gap: 24px">

<svg width="{{L.illW}}" height="{{L.illH}}" viewBox="0 0 240 96" aria-hidden="true" style="display: block">
<line x1="0" y1="88" x2="240" y2="88" style="stroke: var(--border-strong); stroke-width: 1"></line>
<rect x="8" y="36" width="16" height="52" rx="2" style="fill: var(--wb); opacity: .85"></rect>
<rect x="8" y="20" width="16" height="15" rx="2" style="fill: var(--ozon); opacity: .85"></rect>
<rect x="36" y="44" width="16" height="44" rx="2" style="fill: var(--wb); opacity: .85"></rect>
<rect x="36" y="30" width="16" height="13" rx="2" style="fill: var(--ozon); opacity: .85"></rect>
<rect x="64" y="32" width="16" height="56" rx="2" style="fill: var(--wb); opacity: .85"></rect>
<rect x="64" y="14" width="16" height="17" rx="2" style="fill: var(--ozon); opacity: .85"></rect>
<rect x="92" y="48" width="16" height="40" rx="2" style="fill: var(--wb); opacity: .85"></rect>
<rect x="92" y="36" width="16" height="11" rx="2" style="fill: var(--ozon); opacity: .85"></rect>
<rect x="120.5" y="24.5" width="15" height="63" rx="2" style="fill: var(--surface); stroke: var(--border-strong); stroke-dasharray: 3 3"></rect>
<rect x="148.5" y="24.5" width="15" height="63" rx="2" style="fill: var(--surface); stroke: var(--border-strong); stroke-dasharray: 3 3"></rect>
<rect x="176.5" y="24.5" width="15" height="63" rx="2" style="fill: var(--surface); stroke: var(--border-strong); stroke-dasharray: 3 3"></rect>
<rect x="204.5" y="24.5" width="15" height="63" rx="2" style="fill: var(--surface); stroke: var(--border-strong); stroke-dasharray: 3 3"></rect>
<polyline points="16,26 44,34 72,18 100,40 128,30" fill="none" style="stroke: var(--prev); stroke-width: 1.5; stroke-dasharray: 4 3"></polyline>
<text x="170" y="62" text-anchor="middle" style="font-family: Inter, system-ui, sans-serif; font-size: 22px; font-weight: 600; fill: var(--text-3)">?</text>
</svg>

<div style="display: flex; flex-direction: column; align-items: {{L.items}}; gap: 12px">
<span class="num" style="height: 24px; padding: 0 8px; border-radius: 4px; background: var(--neutral-soft); color: var(--neutral); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; letter-spacing: .02em">Ошибка 404</span>
<h1 style="margin: 0; font-size: {{L.h1}}px; line-height: {{L.h1lh}}px; font-weight: 600; letter-spacing: -0.02em">Страница не найдена</h1>
<p style="margin: 0; max-width: 520px; font-size: {{L.lead}}px; line-height: {{L.leadLh}}px; color: var(--text-2)">Возможно, ссылка устарела или адрес набран с ошибкой. С данными магазина всё в порядке — они на месте.</p>
<code style="max-width: 100%; box-sizing: border-box; font-family: var(--mono); font-size: 12px; line-height: 16px; color: var(--text-3); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 6px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">/orders/4412093315/details</code>
</div>

<div style="display: flex; flex-direction: {{L.btnDir}}; gap: 8px; width: {{L.btnW}}">
<a href="{{hrefDash}}" class="btn btn-p" style="height: {{L.btnH}}px; padding: 0 16px; border-radius: var(--r-sm); background: var(--accent); color: var(--text-on-accent); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 600">На дашборд</a>
<button type="button" class="btn btn-s" onClick="{{goBack}}" style="height: {{L.btnH}}px; padding: 0 16px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 500">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4"></path></svg>Назад</button>
</div>

<nav aria-label="Популярные разделы" style="width: 100%; display: flex; flex-direction: column; gap: 10px; padding-top: 8px">
<span style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-3)">Или перейдите в раздел</span>
<div style="display: grid; grid-template-columns: repeat({{L.cols}}, minmax(0, 1fr)); gap: 12px; text-align: left">
<sc-for list="{{links}}" as="l" hint-placeholder-count="3">
<a href="{{l.href}}" class="card-link" style="min-height: 44px; padding: 14px 16px; border-radius: var(--r-lg); border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow-sm); text-decoration: none; color: var(--text); display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="width: 36px; height: 36px; flex-shrink: 0; border-radius: var(--r-md); background: var(--surface-2); color: var(--text-2); display: inline-flex; align-items: center; justify-content: center">
<sc-if value="{{l.isDash}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><rect x="2" y="2" width="5" height="5" rx="1"></rect><rect x="9" y="2" width="5" height="5" rx="1"></rect><rect x="2" y="9" width="5" height="5" rx="1"></rect><rect x="9" y="9" width="5" height="5" rx="1"></rect></svg></sc-if>
<sc-if value="{{l.isOrders}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2h8v12l-2-1-2 1-2-1-2 1V2z"></path><path d="M6 5.5h4M6 8h4"></path></svg></sc-if>
<sc-if value="{{l.isStock}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 5L8 2l5.5 3v6L8 14l-5.5-3V5z"></path><path d="M2.5 5L8 8l5.5-3M8 8v6"></path></svg></sc-if>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 14px; line-height: 20px; font-weight: 600">{{l.title}}</span>
<span class="num" style="font-size: 12px; line-height: 16px; color: var(--text-3)">{{l.sub}}</span>
</span>
<svg class="arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--text-3); flex-shrink: 0"><path d="M3 8h10M9 4l4 4-4 4"></path></svg>
</a>
</sc-for>
</div>
</nav>

<p style="margin: 0; font-size: 13px; line-height: 18px; color: var(--text-3)">Перешли по ссылке из уведомления или письма? Напишите нам: <a href="#" class="lnk">[EMAIL ПОДДЕРЖКИ]</a></p>
</div>
</main>

<sc-if value="{{isMobile}}" hint-placeholder-val="{{ false }}">
<div style="position: sticky; bottom: 0; z-index: 20">
<dc-import name="Chrome" theme="{{theme}}" layout="mobile" active="notfound" part="tabs" hint-size="100%,64px"></dc-import>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"layout":{"editor":"enum","options":["desktop","tablet","mobile"],"default":"desktop"},"minH":{"editor":null},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme === 'dark' ? 'dark' : 'light';
    const layout = ['desktop', 'tablet', 'mobile'].includes(this.props.layout) ? this.props.layout : 'desktop';
    const L = {
      desktop: { pad: '72px 32px 64px', align: 'flex-start', items: 'center', text: 'center', illW: 240, illH: 96, h1: 32, h1lh: 40, lead: 16, leadLh: 24, btnDir: 'row', btnW: 'auto', btnH: 40, cols: 3 },
      tablet: { pad: '64px 24px 48px', align: 'flex-start', items: 'center', text: 'center', illW: 240, illH: 96, h1: 28, h1lh: 36, lead: 16, leadLh: 24, btnDir: 'row', btnW: 'auto', btnH: 40, cols: 3 },
      mobile: { pad: '32px 16px 24px', align: 'flex-start', items: 'flex-start', text: 'left', illW: 200, illH: 80, h1: 24, h1lh: 32, lead: 14, leadLh: 20, btnDir: 'column', btnW: '100%', btnH: 44, cols: 1 }
    }[layout];
    const w = { desktop: 1440, tablet: 768, mobile: 375 }[layout];
    const sfx = (w === 1440 && theme === 'light') ? '' : '-' + w + '-' + theme;
    const nb = ' ';
    return {
      theme, layout, L,
      isMobile: layout === 'mobile',
      minH: Number(this.props.minH ?? 900),
      hrefDash: 'Dashboard' + sfx + '.dc.html',
      goBack: () => { try { window.history.back(); } catch (e) {} },
      links: [
        { title: 'Дашборд', sub: 'Выручка, прибыль, что заканчивается', href: 'Dashboard' + sfx + '.dc.html', isDash: true, isOrders: false, isStock: false },
        { title: 'Заказы', sub: '12' + nb + '345 за последние 30 дней', href: 'Orders' + sfx + '.dc.html', isDash: false, isOrders: true, isStock: false },
        { title: 'Остатки', sub: '3 позиции в статусе «Критично»', href: 'Stock' + sfx + '.dc.html', isDash: false, isOrders: false, isStock: true }
      ]
    };
  }
}
</script>
</body>
</html>
